name: core tests
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: rag-preflight
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build mypy
      - run: python -m build
      - run: python -c "import glob, subprocess, sys; wheels=glob.glob('dist/*.whl'); assert len(wheels)==1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0]])"
      - run: python -m mypy src/rag_preflight
      - run: python -m unittest discover -s tests -v
      - run: python examples/safe_reingestion.py

  numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[numpy,pdf]'
      - run: python examples/source_to_ledger.py
      - run: python -m unittest discover -s tests -v

  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install . langchain-core llama-index-core langgraph
      - run: python -m unittest discover -s tests -p test_frameworks.py -v
