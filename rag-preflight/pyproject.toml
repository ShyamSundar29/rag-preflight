[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-preflight"
version = "0.1.0"
description = "Validate RAG source completeness, embeddings, and safe document re-ingestion"
authors = [{name = "Shyam Sundar Domakonda"}]
keywords = ["rag", "ingestion", "embeddings", "validation", "vector-database"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/ShyamSundar29/rag-preflight"
Documentation = "https://github.com/ShyamSundar29/rag-preflight/tree/main/rag-preflight/docs"
Issues = "https://github.com/ShyamSundar29/rag-preflight/issues"
Changelog = "https://github.com/ShyamSundar29/rag-preflight/blob/main/rag-preflight/CHANGELOG.md"

[project.scripts]
rag-preflight = "rag_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
trial = ["pypdf>=5"]
pdf = ["pypdf>=5"]
office = ["python-docx>=1.2", "python-pptx>=1.0"]
dev = ["build>=1", "mypy>=1.10"]

[tool.setuptools.package-data]
rag_preflight = ["py.typed"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
